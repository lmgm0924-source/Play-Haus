<!DOCTYPE html>
<html lang="es" class="h-full bg-[#f7f4ee] text-[#1a1a1a]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Move It — Play-Haus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bauhaus: {
                            bg: '#f7f4ee',
                            card: '#ffffff',
                            dark: '#18181b',
                            red: '#d9381e',
                            blue: '#205493',
                            yellow: '#f2a900',
                            gray: '#e4dfd5',
                            muted: '#8c857b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Space Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f4ee;
            color: #18181b;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .mono-tag {
            font-family: 'Space Mono', monospace;
        }

        /* Subtle Grid Pattern for Stage Aesthetics */
        .bg-bauhaus-grid {
            background-size: 24px 24px;
            background-image: 
                linear-gradient(to right, rgba(24, 24, 27, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(24, 24, 27, 0.04) 1px, transparent 1px);
        }

        .slot-active {
            border-color: #d9381e;
            background-color: rgba(217, 56, 30, 0.03);
        }

        .figure-card {
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .figure-card:active {
            transform: scale(0.96);
        }

        .figure-selected {
            ring: 3px solid #d9381e;
            border-color: #d9381e;
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(217, 56, 30, 0.25);
        }

        /* Drag ghost styling */
        .dragging {
            opacity: 0.4;
            scale: 0.95;
        }

        /* Animation spotlight keyframes */
        @keyframes spotlightPulse {
            0%, 100% { opacity: 0.3; transform: scale(0.98); }
            50% { opacity: 0.7; transform: scale(1.02); }
        }

        .spotlight-active {
            animation: spotlightPulse 0.8s ease-in-out infinite;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #d9381e;
            border-radius: 2px;
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between overflow-x-hidden selection:bg-bauhaus-red selection:text-white">

    <div id="app" class="min-h-screen w-full flex flex-col max-w-md mx-auto relative bg-bauhaus-bg border-x border-bauhaus-gray shadow-2xl">

        <header class="p-4 pt-5 pb-3 border-b border-bauhaus-dark/10 flex items-center justify-between bg-bauhaus-bg/90 backdrop-blur sticky top-0 z-30">
            <div class="flex items-center space-x-2">

                <div class="w-3 h-3 bg-bauhaus-yellow"></div>

            Taller de Teatro Bauhaus — Geometría en Movimiento
        </footer>
    </div>

        // Utility: Fisher-Yates Shuffle
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Initialize Level
        function initLevel(levelIdx) {
            gameState.currentLevelIdx = levelIdx;

            const level = LEVELS[levelIdx];
            gameState.slots = new Array(level.count).fill(null);
            
            // Randomize bank items
            let shuffled = shuffleArray(level.poses);
            // Ensure bank is not accidentally already in correct order
            let isIdentical = true;
            for(let i=0; i<shuffled.length; i++) {
                if (shuffled[i] !== level.poses[i]) {
                    isIdentical = false;
                    break;
                }
            }
            if (isIdentical && shuffled.length > 1) {
                // Swap first two to guarantee shuffle
                [shuffled[0], shuffled[1]] = [shuffled[1], shuffled[0]];
            }

            gameState.bank = shuffled;

        // ==========================================
        // INTERACTION HANDLERS (TOUCH & DRAG)
        // ==========================================

        function startGame() {
            initLevel(0);
        }

        function restartGame() {
            initLevel(0);
        }

        // Tap Bank Item
        function handleBankClick(poseId) {
            // If already selected, deselect
            if (gameState.selectedPoseId && gameState.selectedPoseId.type === 'bank' && gameState.selectedPoseId.id === poseId) {
                gameState.selectedPoseId = null;
                renderGameView();
                return;
            }

            // Find first empty slot
            const emptyIdx = gameState.slots.findIndex(s => s === null);
            if (emptyIdx !== -1) {
                // Auto place into empty slot for super seamless tap experience
                gameState.slots[emptyIdx] = poseId;
                gameState.bank = gameState.bank.filter(id => id !== poseId);
                gameState.selectedPoseId = null;
            } else {
                // Otherwise select it for swap/target tap
                gameState.selectedPoseId = { type: 'bank', id: poseId };
            }
            renderGameView();
        }

        // Tap Slot Item
        function handleSlotClick(slotIdx) {
            const currentSlotPose = gameState.slots[slotIdx];

            // Scenario 1: A bank item was selected, place it here
            if (gameState.selectedPoseId && gameState.selectedPoseId.type === 'bank') {
                const newPoseId = gameState.selectedPoseId.id;
                
                // If slot already has an item, return that item to bank
                if (currentSlotPose) {
                    gameState.bank.push(currentSlotPose);
                }

                gameState.slots[slotIdx] = newPoseId;
                gameState.bank = gameState.bank.filter(id => id !== newPoseId);
                gameState.selectedPoseId = null;
                renderGameView();
                return;
            }

            // Scenario 2: Tapping an occupied slot with no selection -> remove item back to bank
            if (currentSlotPose) {
                gameState.bank.push(currentSlotPose);
                gameState.slots[slotIdx] = null;
                gameState.selectedPoseId = null;
                renderGameView();
                return;
            }
        }

        // Clear all slots
        function clearSlots() {
            const level = LEVELS[gameState.currentLevelIdx];
            gameState.slots.forEach(poseId => {
                if (poseId) gameState.bank.push(poseId);
            });
            gameState.slots = new Array(level.count).fill(null);
            gameState.selectedPoseId = null;
            renderGameView();
        }

        // HTML5 Drag & Drop Support
        function handleDragStart(event, poseId) {
            event.dataTransfer.setData('text/plain', poseId);
            event.target.classList.add('dragging');
        }

        function handleDragOver(event) {
            event.preventDefault();
        }

        function handleDrop(event, slotIdx) {
            event.preventDefault();
            const poseId = event.dataTransfer.getData('text/plain');
            if (!poseId) return;

            // If coming from bank
            if (gameState.bank.includes(poseId)) {
                if (gameState.slots[slotIdx]) {
                    gameState.bank.push(gameState.slots[slotIdx]);
                }
                gameState.slots[slotIdx] = poseId;
                gameState.bank = gameState.bank.filter(id => id !== poseId);
            } else {
                // Swapping slots
                const oldIdx = gameState.slots.indexOf(poseId);
                if (oldIdx !== -1) {
                    const temp = gameState.slots[slotIdx];
                    gameState.slots[slotIdx] = poseId;
                    gameState.slots[oldIdx] = temp;
                }
            }
            gameState.selectedPoseId = null;
            renderGameView();
        }


        // ==========================================
        // ANIMATION & VERIFICATION
        // ==========================================

        function playSequenceAnimation() {
            if (gameState.isPlayingAnimation) return;
            gameState.isPlayingAnimation = true;

            const level = LEVELS[gameState.currentLevelIdx];
            let step = 0;

            const indicator = document.getElementById('animation-indicator');

            gameState.animationTimer = setInterval(() => {
                // Remove highlight from previous slot
                if (step > 0) {
                    const prevSlot = document.getElementById(`slot-${step - 1}`);
                    if (prevSlot) prevSlot.classList.remove('ring-4', 'ring-bauhaus-red', 'bg-bauhaus-yellow/20');
                }

                if (step < level.count) {
                    const curSlot = document.getElementById(`slot-${step}`);
                    if (curSlot) curSlot.classList.add('ring-4', 'ring-bauhaus-red', 'bg-bauhaus-yellow/20');
                    if (indicator) {
                        const poseId = gameState.slots[step];
                        indicator.innerText = `Paso ${step + 1}: ${POSE_GRAPHICS[poseId].name}`;
                    }
                    step++;
                } else {
                    clearInterval(gameState.animationTimer);
                    gameState.isPlayingAnimation = false;
                    if (indicator) indicator.innerText = 'Secuencia completa. ¡Haz clic en Verificar!';
                }
            }, 700);
        }

        function verifySequence() {
            const level = LEVELS[gameState.currentLevelIdx];

            // Check if every slot matches the exact expected level pose order
            let isCorrect = true;
            for (let i = 0; i < level.count; i++) {
                if (gameState.slots[i] !== level.poses[i]) {
                    isCorrect = false;
                    break;
                }
            }

            if (isCorrect) {
                showModal({
                    success: true,
                    title: level.number === 3 ? "¡Secuencia Final Lograda!" : "¡Excelente!",
                    message: level.successMsg,
                    btnText: level.number === LEVELS.length ? "Ver Resultado" : "Siguiente Nivel",
                    action: () => {
                        hideModal();
                        if (gameState.currentLevelIdx + 1 < LEVELS.length) {
                            initLevel(gameState.currentLevelIdx + 1);
                        } else {
                            renderCompletionView();
                        }
                    }
                });
            } else {
                showModal({
                    success: false,
                    title: "Revisa la secuencia",
                    message: "La dirección o postura no coinciden con la secuencia lógica. Utiliza el botón 💡 Pista si necesitas ayuda.",
                    btnText: "Reorganizar",
                    action: () => {
                        hideModal();
                    }
                });
            }
        }

        // Show Hint Modal
        function showHintModal() {
            const level = LEVELS[gameState.currentLevelIdx];
            showModal({
                success: false,
                isHint: true,
                title: `💡 Pista — Nivel ${level.number}`,
                message: level.hintText,
                btnText: "Entendido",
                action: () => {
                    hideModal();
                }
            });
        }

        // Modal Helpers
        const modalOverlay = document.getElementById('modal-overlay');
        const modalIcon = document.getElementById('modal-icon');
        const modalTitle = document.getElementById('modal-title');
        const modalMsg = document.getElementById('modal-message');
        const modalBtn = document.getElementById('modal-btn');

        function showModal({ success, isHint, title, message, btnText, action }) {
            modalTitle.innerText = title;
            modalMsg.innerText = message;
            modalBtn.innerText = btnText;

            if (isHint) {
                modalIcon.className = "w-12 h-12 mx-auto rounded-full flex items-center justify-center text-bauhaus-dark text-xl font-bold bg-bauhaus-yellow border-2 border-bauhaus-dark shadow-lg";
                modalIcon.innerText = "💡";
                modalBtn.className = "w-full py-3 px-6 bg-bauhaus-dark text-white font-extrabold rounded-xl tracking-wider uppercase text-sm hover:bg-bauhaus-red transition-all active:scale-95 shadow-md";
            } else if (success) {
                modalIcon.className = "w-12 h-12 mx-auto rounded-full flex items-center justify-center text-white text-xl font-bold bg-bauhaus-red shadow-lg";
                modalIcon.innerText = "✓";
                modalBtn.className = "w-full py-3 px-6 bg-bauhaus-red text-white font-extrabold rounded-xl tracking-wider uppercase text-sm hover:bg-bauhaus-dark transition-all active:scale-95 shadow-md";
            } else {
                modalIcon.className = "w-12 h-12 mx-auto rounded-full flex items-center justify-center text-white text-xl font-bold bg-bauhaus-dark shadow-lg";
                modalIcon.innerText = "!";
                modalBtn.className = "w-full py-3 px-6 bg-bauhaus-dark text-white font-extrabold rounded-xl tracking-wider uppercase text-sm hover:bg-bauhaus-red transition-all active:scale-95 shadow-md";
            }

            modalBtn.onclick = action;
            modalOverlay.classList.remove('hidden');
        }

        function hideModal() {
            modalOverlay.classList.add('hidden');
        }

        // Initialize App on Window Load
        window.onload = function() {
            renderIntroView();
        };
    </script>
</body>
